services:
  contextbridge:
    build: .
    command: ["contextbridge", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Keep container telemetry on the mounted volume even if the host .env
      # contains a Windows-specific absolute database path.
      CONTEXTBRIDGE_DB_PATH: /app/data/contextbridge.db
    volumes:
      - ./data:/app/data
