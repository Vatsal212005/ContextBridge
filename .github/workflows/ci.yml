name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        env:
          CONTEXTBRIDGE_DRY_RUN: 'true'
          GITHUB_WRITES_ENABLED: 'false'
          GITHUB_TOKEN: ''
        run: python -m pytest
      - name: Offline evaluation smoke test
        env:
          CONTEXTBRIDGE_DRY_RUN: 'true'
          GITHUB_WRITES_ENABLED: 'false'
        run: python scripts/evaluation_check.py
      - name: Dashboard smoke test
        env:
          CONTEXTBRIDGE_DRY_RUN: 'true'
          GITHUB_WRITES_ENABLED: 'false'
        run: python scripts/dashboard_check.py
