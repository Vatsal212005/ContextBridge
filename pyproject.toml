[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "contextbridge-mcp"
version = "0.9.1"
description = "A secure MCP gateway for authenticated developer infrastructure."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "ContextBridge Contributors" }
]
dependencies = [
  "mcp[cli]==2.0.0",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "google-genai>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
contextbridge = "contextbridge.server:main"
contextbridge-actions = "contextbridge.actions_cli:main"
contextbridge-dashboard = "contextbridge.dashboard:main"
contextbridge-eval = "contextbridge.evaluation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.package-data]
contextbridge = ["dashboard_static/*", "dashboard_static/assets/*", "eval_data/*.json"]
